<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PACIFY — How To Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= PACIFY motion brief v6 — P5 tokens ================= */
:root{
  --crimson:#E60012; --crimsonDeep:#A3000C; --yellow:#FCEE21; --black:#0A0A0A;
  --ink:#111111; --paper:#FFFFFF; --cream:#F5EFE1; --gold:#f2c14e;
  --felt:#16a34a; --feltDk:#0d5c30; --surface:#141414;
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Oswald',Arial,sans-serif;touch-action:none}
#fit{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1600px;height:900px;background:var(--black);overflow:hidden;transform-origin:center center}
#stage.shake{animation:shakeK .45s linear both}
#cam{position:absolute;inset:0;will-change:transform}
/* ---------- background textures ---------- */
.bg{position:absolute;inset:0;pointer-events:none}
.bg-stripes{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.028) 0 2px,transparent 2px 26px)}
.bg-halftone{background:radial-gradient(rgba(230,0,18,.12) 1.6px,transparent 1.6px);background-size:20px 20px;opacity:.55;
  -webkit-mask-image:radial-gradient(ellipse at 78% 12%,#000 0%,transparent 60%);mask-image:radial-gradient(ellipse at 78% 12%,#000 0%,transparent 60%)}
.bg-vign{background:radial-gradient(ellipse at 50% 46%,transparent 46%,rgba(0,0,0,.62) 100%)}
/* ---------- HUD chrome ---------- */
.hud{position:absolute;z-index:60;pointer-events:none}
#hudLogo{top:24px;left:30px;display:flex;gap:10px;align-items:center}
#hudLogo .lg{font-family:Anton;font-size:24px;color:#fff;background:var(--crimson);padding:2px 12px;transform:skewX(-8deg);letter-spacing:2px;box-shadow:4px 4px 0 #000}
#hudLogo .ht{font-size:15px;letter-spacing:4px;color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase}
#hudRight{top:26px;right:32px;display:flex;gap:18px;align-items:flex-start}
#hudCount{text-align:right}
#hudCount .n{font-family:Anton;font-size:22px;color:#fff;letter-spacing:2px}
#hudCount .l{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase}
#menuBtn{pointer-events:auto;cursor:pointer;font-family:Anton;font-size:15px;letter-spacing:2px;color:#fff;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.25);padding:8px 16px;transform:skewX(-8deg);margin-top:2px;transition:background .2s}
#menuBtn:hover{background:var(--crimson);border-color:var(--crimson)}
/* ---------- captions ---------- */
#cap{position:absolute;left:0;right:0;bottom:44px;z-index:55;text-align:center;pointer-events:none}
#capSub{font-size:17px;letter-spacing:5px;color:var(--yellow);font-weight:600;text-transform:uppercase;margin-bottom:8px;min-height:22px;opacity:.95;
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,5px 5px 0 rgba(0,0,0,.65)}
#capBig{font-family:Anton;font-size:50px;color:#fff;letter-spacing:2px;text-transform:uppercase;
  text-shadow:5px 5px 0 var(--crimson),10px 10px 0 rgba(0,0,0,.9);transform:skewX(-6deg)}
#cap.show #capBig{animation:capIn .42s cubic-bezier(.175,.885,.32,1.275) both}
#cap.show #capSub{animation:capIn .5s .08s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes capIn{from{opacity:0;transform:translateY(30px) skewX(-6deg)}to{opacity:1;transform:translateY(0) skewX(-6deg)}}
/* ---------- progress ---------- */
#dots{position:absolute;left:0;right:0;bottom:16px;display:flex;gap:10px;justify-content:center;z-index:60}
#dots button{width:26px;height:8px;border:0;background:rgba(255,255,255,.18);cursor:pointer;transform:skewX(-20deg);transition:background .2s}
#dots button:hover{background:rgba(255,255,255,.5)}
#dots button.cur{background:var(--crimson)}
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--crimson);width:0;z-index:61;transition:width .2s linear}
/* ---------- chapter menu ---------- */
#menu{position:absolute;inset:0;z-index:75;background:rgba(5,5,5,.94);display:none;padding:70px 110px;overflow:hidden}
#menu.open{display:block}
#menu .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;border-bottom:3px solid var(--crimson);padding-bottom:18px}
#menu .mhead .t{font-family:Anton;font-size:44px;color:#fff;letter-spacing:4px}
#menu .mhead .t span{color:var(--crimson)}
#menuX{cursor:pointer;background:none;border:3px solid rgba(255,255,255,.3);color:#fff;font-family:Anton;font-size:20px;padding:6px 18px;transform:skewX(-8deg)}
#menuX:hover{border-color:var(--crimson);color:var(--crimson)}
#mlist{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px 40px}
.mgroup .gh{font-size:14px;letter-spacing:5px;color:var(--yellow);font-weight:600;margin-bottom:10px;text-transform:uppercase}
.mitem{display:flex;gap:12px;align-items:baseline;padding:7px 10px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.mitem:hover{background:rgba(230,0,18,.15);border-left-color:var(--crimson);transform:translateX(4px)}
.mitem.cur{background:rgba(230,0,18,.22);border-left-color:var(--crimson)}
.mitem .mn{font-family:Anton;font-size:19px;color:var(--crimson);min-width:34px}
.mitem .ml{font-size:17px;letter-spacing:2px;color:#fff;font-weight:600;text-transform:uppercase}
/* ---------- generic primitives ---------- */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .18s}
.scene.active{opacity:1;visibility:visible}
.b{position:absolute;inset:0;opacity:0;pointer-events:none;perspective:1200px}
.b.on{opacity:1}
.chip{position:absolute;display:inline-block;transform:translateX(-50%) skewX(-8deg);font-family:Anton;letter-spacing:2px;white-space:nowrap;
  padding:10px 26px;background:var(--black);color:#fff;border:3px solid #000;box-shadow:6px 6px 0 rgba(0,0,0,.9);font-size:34px}
.chip.yel{background:var(--yellow);color:var(--black)}
.chip.crim{background:var(--crimson);color:#fff}
.chip.ink{background:var(--ink);color:var(--cream)}
.b.on .chip{animation:popTick .5s cubic-bezier(.175,.885,.32,1.275) both;animation-delay:var(--d,0s)}
.b.on .chip.rise{animation:riseC .55s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
.b.on .chip.slam{animation:stampIn .5s cubic-bezier(.175,.885,.32,1.275) both;animation-delay:var(--d,0s)}
.big{position:absolute;transform:translateX(-50%);font-family:Anton;color:#fff;letter-spacing:3px;white-space:nowrap;text-align:center;line-height:1.02}
.b.on .big{animation:riseC .6s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
.b.on .big.slam{animation:stampIn .55s cubic-bezier(.175,.885,.32,1.275) both;animation-delay:var(--d,0s)}
.outline{color:transparent;-webkit-text-stroke:2.5px #fff}
.sub{position:absolute;transform:translateX(-50%);font-size:20px;letter-spacing:5px;color:rgba(255,255,255,.75);font-weight:600;text-transform:uppercase;white-space:nowrap}
.b.on .sub{animation:riseC .6s .12s cubic-bezier(.22,1,.36,1) both}
/* ---------- chapter cards ---------- */
.chcard{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#161616 0%,#050505 80%)}
.b.on .chcard{animation:vFade .4s both}
.chnum{position:absolute;left:50%;top:320px;transform:translateX(-50%);font-family:Anton;font-size:250px;color:transparent;
  -webkit-text-stroke:3px rgba(230,0,18,.85);line-height:1}
.b.on .chnum{animation:stampIn .6s cubic-bezier(.175,.885,.32,1.275) both}
.chtitle{position:absolute;left:50%;top:540px;transform:translateX(-50%);font-family:Anton;font-size:84px;color:#fff;letter-spacing:8px;text-shadow:6px 6px 0 var(--crimson)}
.b.on .chtitle{animation:riseC .6s .25s both}
.chline{position:absolute;left:50%;top:505px;width:340px;height:4px;background:var(--yellow);transform:translateX(-50%)}
.b.on .chline{animation:chLine .5s .15s both}
@keyframes chLine{from{transform:translateX(-50%) scaleX(0)}to{transform:translateX(-50%) scaleX(1)}}
.typing::after{content:'▌';color:var(--crimson);animation:blinkK .8s steps(1) infinite}
@keyframes blinkK{50%{opacity:0}}
/* ---------- cards (good = white/gold, bad = dark/red, tricks = black/yellow) ---------- */
.card{position:absolute;width:170px;height:238px;background:linear-gradient(160deg,#FDFBF4,#F0E6CF);border:3px solid var(--gold);border-radius:10px;
  box-shadow:8px 8px 0 rgba(0,0,0,.85);transition:transform .35s,opacity .35s,filter .35s}
.card .pw{position:absolute;top:6px;left:13px;font-family:Anton;font-size:46px;color:#0A0A0A;line-height:1}
.card .bn{position:absolute;inset:0;display:grid;place-items:center;font-family:Anton;font-size:150px;color:rgba(10,10,10,.07);line-height:1;pointer-events:none}
.card.bad .bn{color:rgba(245,239,225,.07)}
.card .nm{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-weight:600;font-size:15px;letter-spacing:2px;text-transform:uppercase;padding:3px 0;
  background:rgba(10,10,10,.86);color:var(--cream);border:1px solid rgba(255,255,255,.14)}
.card .gem{position:absolute;top:10px;right:13px;width:17px;height:17px;transform:rotate(45deg);border:2.5px solid #8a6a10;background:var(--gold)}
.card.good .gem{background:var(--gold);border-color:#8a6a10}
.card .art{position:absolute;inset:48px 12px 44px;display:grid;place-items:center;font-family:Anton;font-size:88px;color:rgba(10,10,10,.8);line-height:1}
.card .art svg{width:86%;height:86%}
.card.bad{background:linear-gradient(160deg,#262626,#0F0F0F);border-color:var(--crimson)}
.card.bad .pw{color:var(--cream)}
.card.bad .nm{background:rgba(245,239,225,.93);color:#0A0A0A;border-color:rgba(0,0,0,.28)}
.card.bad .art{color:rgba(245,239,225,.88)}
.card.bad .gem{background:var(--crimson);border-color:#7d0009}
.card.trick{background:linear-gradient(165deg,#1B1B1B,#0E0E0E);border-color:var(--yellow)}
.card.trick .nm{background:rgba(252,238,33,.93);color:#0A0A0A;border-color:rgba(0,0,0,.3)}
.card.trick .pw,.card.trick .art{color:rgba(252,238,33,.28)}
.card.trick .gem{border-color:var(--yellow);background:transparent}
.card.good::after,.card.bad::after{content:'';position:absolute;inset:6px;border:1.5px solid rgba(0,0,0,.16);border-radius:7px;pointer-events:none}
.card.bad::after{border-color:rgba(255,255,255,.09)}
.card.trick::after{content:'';position:absolute;top:8px;left:8px;width:18px;height:18px;border-top:3px solid var(--yellow);border-left:3px solid var(--yellow)}
.card.trick::before{content:'';position:absolute;bottom:8px;right:8px;width:18px;height:18px;border-bottom:3px solid var(--yellow);border-right:3px solid var(--yellow)}
.card .sig{position:absolute;inset:40px 18px 44px;display:grid;place-items:center}
.card .sig svg{width:78%;height:78%}
.card.back{background:linear-gradient(165deg,#181818,#0D0D0D);border-color:#2A2A2A}
.card.back::after{content:'';position:absolute;inset:11px;border:2px solid rgba(230,0,18,.75);border-radius:6px}
.card.back::before{content:'';position:absolute;left:16px;right:16px;top:16px;height:16px;
  background:repeating-linear-gradient(-45deg,rgba(230,0,18,.65) 0 7px,transparent 7px 14px);pointer-events:none}
.card.back .bk{position:absolute;inset:0;display:grid;place-items:center;color:rgba(230,0,18,.85);font-size:54px}
.card.ghost{background:rgba(255,255,255,.04);border:3px dashed rgba(255,255,255,.55);box-shadow:none}
.card.ghost .pw,.card.ghost .nm{color:rgba(255,255,255,.8)}
.card.ghost .art{color:rgba(255,255,255,.12)}
.card.sm{width:112px;height:156px}
.card.sm .pw{font-size:30px;left:10px}
.card.sm .bn{font-size:96px}
.card.sm .nm{bottom:7px;left:7px;right:7px;font-size:11px;letter-spacing:1px;padding:2px 0}
.card.sm .art{font-size:56px;inset:34px 8px 30px}
.card.sm .gem{width:12px;height:12px;top:7px;right:9px}
.card.dimmed{opacity:.16;filter:grayscale(.7)}
.card.hl.bad{box-shadow:8px 8px 0 rgba(230,0,18,.85);filter:brightness(1.12)}
.card.hl.good{box-shadow:8px 8px 0 rgba(242,193,78,.9);filter:brightness(1.08)}
.card.loser{transform:translate(-50%,-50%) rotate(7deg) translateY(26px) !important;opacity:.45;filter:grayscale(.6)}
.card.sel{transform:translate(-50%,-50%) translateY(-36px) !important;box-shadow:8px 8px 0 rgba(230,0,18,.9)}
.card.fadeout{opacity:0}
/* trick reveal (card first) */
.tcard{left:800px;top:400px;transform:translate(-50%,-50%) scale(1.25)}
.b.on .tcard{animation:tcardIn .65s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes tcardIn{from{opacity:0;transform:translate(-50%,-50%) translateY(90px) scale(1.05)}to{opacity:1;transform:translate(-50%,-50%) scale(1.25)}}
/* ---------- felt ---------- */
.felt{position:absolute;inset:110px 130px;background:radial-gradient(ellipse at 50% 40%,#1fa762 0%,var(--felt) 46%,var(--feltDk) 100%);
  border:3px solid #0A0A0A;border-radius:28px;box-shadow:0 26px 70px rgba(0,0,0,.6),inset 0 0 130px rgba(0,0,0,.38)}
.felt::after{content:'';position:absolute;inset:14px;border:2px solid rgba(255,255,255,.12);border-radius:18px}
.felt.pulse{animation:pulseFelt 1.5s ease-in-out infinite}
@keyframes pulseFelt{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .6s}
.b.on .dim{opacity:1}
/* ---------- keyframes ---------- */
@keyframes riseC{from{opacity:0;transform:translateX(-50%) translateY(46px) skewX(-8deg)}to{opacity:1;transform:translateX(-50%) translateY(0) skewX(0deg)}}
@keyframes stampIn{0%{opacity:0;transform:translateX(-50%) scale(2.6) rotate(-16deg)}60%{opacity:1;transform:translateX(-50%) scale(.92) rotate(-9deg)}100%{opacity:1;transform:translateX(-50%) scale(1) rotate(var(--rot,-8deg))}}
@keyframes popTick{from{opacity:0;transform:translateX(-50%) scale(.4) rotate(-6deg)}70%{opacity:1;transform:translateX(-50%) scale(1.14) rotate(1deg)}to{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}}
@keyframes flyIn{from{transform:translate(calc(var(--fx,0px) - 50%),calc(var(--fy,0px) - 50%)) rotate(var(--fr,0deg)) scale(.72)}
                 to{transform:translate(-50%,-50%) rotate(var(--tr,0deg)) scale(1)}}
@keyframes sideIn{from{opacity:0;transform:translateX(calc(-50% + var(--sx,0px))) skewX(-8deg)}to{opacity:1;transform:translateX(-50%) skewX(-8deg)}}
@keyframes wipeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes flashK{0%{opacity:0}10%{opacity:.95}100%{opacity:0}}
@keyframes shakeK{0%,100%{transform:translate(0,0)}15%{transform:translate(-8px,5px)}30%{transform:translate(7px,-6px)}45%{transform:translate(-5px,4px)}60%{transform:translate(4px,-3px)}80%{transform:translate(-2px,2px)}}
@keyframes bannerCrash{0%{opacity:0;transform:translateX(-50%) translateY(-300px) rotate(-4deg)}65%{opacity:1;transform:translateX(-50%) translateY(14px) rotate(-4deg)}100%{opacity:1;transform:translateX(-50%) translateY(0) rotate(-4deg)}}
@keyframes swallowK{to{transform:translate(calc(-50% + var(--sx,0px)),calc(-50% + var(--sy,0px))) rotate(320deg) scale(.06);opacity:0}}
@keyframes floatY{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-14px)}}
@keyframes slashIn{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(0) skewX(-18deg)}}
@keyframes ringK{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
@keyframes chipPop{from{opacity:0;transform:translateX(-50%) scale(.3)}70%{opacity:1;transform:translateX(-50%) scale(1.15)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes burstK{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes vFade{from{opacity:0}to{opacity:1}}
/* ---------- overlays ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#flash.go{animation:flashK .5s linear both}
#wipe{position:absolute;inset:-40px;pointer-events:none;z-index:68}
#wipe i{position:absolute;top:0;bottom:0;left:-30%;width:36%;background:var(--crimson);transform:translateX(-160%) skewX(-14deg);display:block}
#wipe.go i{animation:wpK .55s cubic-bezier(.65,0,.35,1) both}
@keyframes wpK{0%{transform:translateX(-160%) skewX(-14deg)}45%{transform:translateX(320%) skewX(-14deg)}100%{transform:translateX(620%) skewX(-14deg)}}
#begin{position:absolute;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 40%,#151515 0%,#050505 78%);display:grid;place-items:center}
#begin .in{text-align:center;transform:skewX(-4deg)}
#begin .t1{font-family:Anton;font-size:150px;color:#fff;letter-spacing:4px;text-shadow:10px 10px 0 var(--crimson),20px 20px 0 rgba(0,0,0,.85)}
#begin .t2{font-size:22px;letter-spacing:10px;color:var(--yellow);font-weight:600;margin:14px 0 46px;text-transform:uppercase}
#begin .go{pointer-events:auto;cursor:pointer;font-family:Anton;font-size:38px;letter-spacing:3px;color:#fff;background:var(--crimson);border:0;
  padding:20px 54px;box-shadow:8px 8px 0 #000;transform:skewX(-8deg);transition:transform .15s,box-shadow .15s}
#begin .go:hover{transform:skewX(-8deg) translate(-3px,-3px);box-shadow:12px 12px 0 #000}
#begin .hint{margin-top:26px;font-size:15px;letter-spacing:4px;color:rgba(255,255,255,.4);text-transform:uppercase}
/* ---------- freeze (QA) ---------- */
.freeze .b.on *,.freeze .b.on{animation-duration:.001s !important;animation-delay:0s !important;animation-iteration-count:1 !important}
.freeze *{transition-duration:.001s !important;transition-delay:0s !important}
.freeze .felt{animation:none !important}
.freeze #begin{display:none}
.freeze #capBig .w{animation-duration:.001s !important;animation-delay:0s !important}
/* ---------- vignette replacement ---------- */
.scene.h0 .b[data-b="0"]{opacity:0 !important;transition:opacity .35s}
.scene.h01 .b[data-b="0"],.scene.h01 .b[data-b="1"]{opacity:0 !important;transition:opacity .35s}
.scene.h1 .b[data-b="1"]{opacity:0 !important;transition:opacity .35s}
.scene.h2 .b[data-b="2"]{opacity:0 !important;transition:opacity .35s}
.plaque{position:absolute;transform:translateX(-50%);background:var(--ink);border:3px solid #000;box-shadow:6px 6px 0 rgba(0,0,0,.9);
  padding:8px 22px;text-align:center;min-width:150px;transition:transform .4s,filter .4s;z-index:30}
.plaque .lb{font-size:15px;letter-spacing:4px;color:rgba(255,255,255,.65);font-weight:600}
.plaque .vl{font-family:Anton;font-size:52px;color:#fff;line-height:1.05}
.plaque.you{background:var(--crimson)}
.plaque.you .lb{color:rgba(255,255,255,.8)}
.b.on .plaque{animation:riseC .5s both}
.vlay{position:absolute;inset:96px 116px;border-radius:24px;background:rgba(0,0,0,.82);border:3px solid rgba(230,0,18,.5)}
.b.on .vlay{animation:vFade .45s both}
.wash{position:absolute;top:96px;bottom:96px;width:730px}
.wash.l{left:88px;background:linear-gradient(90deg,rgba(230,0,18,.28),rgba(230,0,18,.05));border-left:6px solid var(--crimson)}
.wash.r{right:88px;background:linear-gradient(270deg,rgba(242,193,78,.30),rgba(242,193,78,.06));border-right:6px solid var(--gold)}
.b.on .wash{animation:wipeIn .6s cubic-bezier(.22,1,.36,1) both}
/* s01 */
.s1slash{position:absolute;top:-5%;height:110%;width:46%;background:var(--crimson);transform:skewX(-18deg)}
.s1slash.a{left:-6%;box-shadow:14px 14px 0 rgba(0,0,0,.9)}
.s1slash.b{left:52%;width:14%;background:var(--yellow);opacity:.9}
.b.on .s1slash.a{animation:slashIn .5s cubic-bezier(.65,0,.35,1) both}
.b.on .s1slash.b{animation:slashIn .5s .12s cubic-bezier(.65,0,.35,1) both}
.burst{position:absolute;left:50%;top:44%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(rgba(230,0,18,.28) 2px,transparent 2px);background-size:22px 22px}
.b.on .burst{animation:burstK .7s cubic-bezier(.22,1,.36,1) both}
.b.on .flyc{animation:flyIn .65s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
/* s02 */
.b.on .seat{animation:sideIn .6s cubic-bezier(.22,1,.36,1) both}
#s02felt{transform:translateY(680px);opacity:0;transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .4s}
#s02felt.up{transform:translateY(0);opacity:1}
.deck{position:absolute}
.deck.dim{opacity:.26;transition:opacity .5s}
.x2{position:absolute;left:50%;transform:translateX(-50%);background:var(--black);border:6px solid var(--crimson);

const isFrozen = ()=> stage.classList.contains("freeze");
function countUp(elx, from, to, ms){
  if(!elx) return;
  if(isFrozen()){ elx.textContent=to; return; }
  const t0=performance.now(); elx.textContent=from;
  let ticked=0;
  const step=(t)=>{ const p=Math.min((t-t0)/ms,1);
    elx.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    const marks=[.3,.6,.9];
    while(ticked<3 && p>=marks[ticked]){ sfx("tick"); ticked++; }
    if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function typeOn(elx, str, cps){
  if(!elx) return;
  if(elx._t) clearInterval(elx._t);
  if(isFrozen()){ elx.textContent=str; return; }
  elx.textContent=""; elx.classList.add("typing");
  let i=0; const iv=setInterval(()=>{ i++; elx.textContent=str.slice(0,i);
    if(i>=str.length){ clearInterval(iv); elx._t=null; elx.classList.remove("typing"); } }, 1000/(cps||16));
  elx._t=iv;
}

  nudge(elx,ms){ if(!elx||!elx.animate)return; elx.animate([{transform:"translateX(0)"},{transform:"translateX(-14px)"},{transform:"translateX(11px)"},{transform:"translateX(0)"}],{duration:ms||650,easing:"ease-in-out",composite:"add"}); },
  glow(elx,ms){ if(!elx||!elx.animate)return; elx.animate([{filter:"brightness(1)"},{filter:"brightness(1.55)"},{filter:"brightness(1)"}],{duration:ms||720,easing:"ease-in-out"}); },
};
function doFx(root,fx){

let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function noiseBuf(ctx,dur){ const b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur|0),ctx.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function sfxSynth(ctx,t,kind,out){
  try{
    if(kind==="deal") kind="draw";
    const g=ctx.createGain(); g.connect(out);
    const env=(v0,d)=>{ g.gain.setValueAtTime(v0,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); };
    const blip=(fr,type,v0,d,dt)=>{ const o=ctx.createOscillator(); o.type=type||"sine"; o.frequency.value=fr;
      const og=ctx.createGain(); o.connect(og); og.connect(out);
      og.gain.setValueAtTime(v0,t+(dt||0)); og.gain.exponentialRampToValueAtTime(.0001,t+(dt||0)+d);
      o.start(t+(dt||0)); o.stop(t+(dt||0)+d+.02); };
    if(kind==="whoosh"){
      const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,.4);
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2600,t+.35); f.Q.value=1.2;
      src.connect(f); f.connect(g); env(.28,.42);
      src.start(t); src.stop(t+.45);
    } else if(kind==="slide"){
      const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,.2);
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(700,t+.18); f.Q.value=1.4;
      src.connect(f); f.connect(g); env(.16,.2);
      src.start(t); src.stop(t+.22);
    } else if(kind==="draw"){
      const n1=ctx.createBufferSource(); n1.buffer=noiseBuf(ctx,.06);
      const f1=ctx.createBiquadFilter(); f1.type="bandpass"; f1.frequency.setValueAtTime(2200,t); f1.frequency.exponentialRampToValueAtTime(900,t+.05); f1.Q.value=1.1;
      n1.connect(f1); f1.connect(g); env(.3,.06); n1.start(t); n1.stop(t+.07);
      const n2=ctx.createBufferSource(); n2.buffer=noiseBuf(ctx,.07);
      const f2=ctx.createBiquadFilter(); f2.type="bandpass"; f2.frequency.setValueAtTime(1400,t+.06); f2.Q.value=1.2;
      const g2=ctx.createGain(); n2.connect(f2); f2.connect(g2); g2.connect(out);
      g2.gain.setValueAtTime(.0001,t+.06); g2.gain.linearRampToValueAtTime(.18,t+.075); g2.gain.exponentialRampToValueAtTime(.0001,t+.13);
      n2.start(t+.06); n2.stop(t+.14);
      blip(2600,"square",.05,.02);
    } else if(kind==="place"){
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(85,t+.09);
      o.connect(g); env(.18,.1); o.start(t); o.stop(t+.12);
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.05);
      const nf=ctx.createBiquadFilter(); nf.type="lowpass"; nf.frequency.value=1100;
      n.connect(nf); nf.connect(g); env(.12,.05); n.start(t); n.stop(t+.06);
    } else if(kind==="flip"){
      blip(900,"triangle",.12,.07); blip(1350,"triangle",.12,.07,.05);
    } else if(kind==="land"){
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(90,t+.1);
      o.connect(g); env(.2,.12); o.start(t); o.stop(t+.14);
    } else if(kind==="block"){
      blip(620,"square",.18,.16);
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.08);
      const nf=ctx.createBiquadFilter(); nf.type="highpass"; nf.frequency.value=2500;
      const ng=ctx.createGain(); n.connect(nf); nf.connect(ng); ng.connect(out);
      ng.gain.setValueAtTime(.14,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.08);
      n.start(t);
    } else if(kind==="score"){
      blip(520,"sine",.14,.2); blip(780,"sine",.14,.2,.08);
    } else if(kind==="sting"){
      [98,104].forEach(fr=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=fr;
        const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=700;
        const og=ctx.createGain(); o.connect(f); f.connect(og); og.connect(out);
        og.gain.setValueAtTime(.16,t); og.gain.exponentialRampToValueAtTime(.0001,t+.55);
        o.start(t); o.stop(t+.6); });
    } else if(kind==="swallow"){
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(480,t); o.frequency.exponentialRampToValueAtTime(70,t+.7);
      o.connect(g); env(.22,.75); o.start(t); o.stop(t+.8);
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.7);
      const nf=ctx.createBiquadFilter(); nf.type="bandpass"; nf.frequency.setValueAtTime(1500,t); nf.frequency.exponentialRampToValueAtTime(200,t+.65); nf.Q.value=1.1;
      n.connect(nf); nf.connect(g); env(.14,.7); n.start(t); n.stop(t+.75);
    } else if(kind==="swell"){
      [100,104.5].forEach(fr=>{ const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(fr,t); o.frequency.linearRampToValueAtTime(fr*1.5,t+.85);
        const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
        const og=ctx.createGain(); o.connect(f); f.connect(og); og.connect(out);
        og.gain.setValueAtTime(.0001,t); og.gain.linearRampToValueAtTime(.16,t+.5); og.gain.exponentialRampToValueAtTime(.0001,t+.95);
        o.start(t); o.stop(t+1); });
    } else if(kind==="thump"||kind==="slam"||kind==="boom"){
      const o=ctx.createOscillator(); o.type="sine";
      const f0=kind==="boom"?90:120, f1=kind==="boom"?28:40, dur=kind==="boom"?.7:.3;
      o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
      const vol=kind==="boom"?.5:.32; o.connect(g); env(vol,dur+.05); o.start(t); o.stop(t+dur+.05);
      if(kind!=="thump"){ const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.08);
        const nf=ctx.createBiquadFilter(); nf.type="lowpass"; nf.frequency.value=900;
        n.connect(nf); nf.connect(g); env(.25,.08); n.start(t); }
    } else if(kind==="stampS"){
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(50,t+.18);
      o.connect(g); env(.34,.2); o.start(t); o.stop(t+.22);
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.06);
      const nf=ctx.createBiquadFilter(); nf.type="lowpass"; nf.frequency.value=1600;
      n.connect(nf); nf.connect(g); env(.2,.06); n.start(t); n.stop(t+.07);
      blip(1900,"square",.06,.02);
    } else if(kind==="crash"){
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(45,t+.25);
      o.connect(g); env(.32,.28); o.start(t); o.stop(t+.3);
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.2);
      const nf=ctx.createBiquadFilter(); nf.type="lowpass"; nf.frequency.value=1400;
      n.connect(nf); nf.connect(g); env(.22,.2); n.start(t); n.stop(t+.22);
    } else if(kind==="tick"){
      blip(1250,"square",.1,.045);
    } else if(kind==="pop"){
      blip(740,"triangle",.14,.05);
    } else if(kind==="click"){
      blip(1900,"square",.08,.02);
    } else if(kind==="chime"){
      [660,990].forEach((fr,i)=>blip(fr,"sine",.14,.5,i*.07));
    } else if(kind==="sweep"){
      const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,.5);
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(3200,t+.45); f.Q.value=1.1;
      src.connect(f); f.connect(g); env(.16,.5);
      src.start(t); src.stop(t+.52);
    } else if(kind==="wipe"){
      const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,.22);
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(2400,t); f.frequency.exponentialRampToValueAtTime(400,t+.2); f.Q.value=1.5;
      src.connect(f); f.connect(g); env(.16,.22);
      src.start(t); src.stop(t+.24);
    } else if(kind==="riser"){
      const src=ctx.createBufferSource(); src.buffer=noiseBuf(ctx,.95);
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(220,t); f.frequency.exponentialRampToValueAtTime(3600,t+.9); f.Q.value=1;
      src.connect(f); f.connect(g);
      g.gain.setValueAtTime(.004,t); g.gain.linearRampToValueAtTime(.22,t+.8); g.gain.linearRampToValueAtTime(.0001,t+.98);
      src.start(t); src.stop(t+1);
    } else if(kind==="hit2"){
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(28,t+.5);
      o.connect(g); env(.5,.55); o.start(t); o.stop(t+.58);
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.1);
      const nf=ctx.createBiquadFilter(); nf.type="lowpass"; nf.frequency.value=700;
      n.connect(nf); nf.connect(g); env(.16,.1); n.start(t);
      blip(52,"square",.14,.2);
    } else if(kind==="glass"){
      const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,.12);
      const nf=ctx.createBiquadFilter(); nf.type="highpass"; nf.frequency.value=2800;
      n.connect(nf); nf.connect(g); env(.16,.12); n.start(t);
      [2300,1900,1500,1150].forEach((fr,i)=>blip(fr,"triangle",.12,.07,i*.03));
    } else if(kind==="sparkle"){
      [660,880,1175,1568].forEach((fr,i)=>blip(fr,"sine",.11,.12,i*.06));
    }
  }catch(e){}
}
function sfx(kind,delayMs){
  if(window.__VIDEO) return;
  const fire=()=>{
    let ctx; try{ ctx=ac(); }catch(e){ return; }
    if(ctx.state==="suspended"){ try{ ctx.resume(); }catch(e){} }
    sfxSynth(ctx,ctx.currentTime,kind,ctx.destination);
  };
  if(delayMs>0) setTimeout(fire,delayMs); else fire();
}

function resetScene(s){
  const root=document.getElementById(s.id);
  root.classList.remove("h0","h01","h1","h2");
  root.querySelectorAll(".b").forEach(g=>g.classList.remove("on"));
  root.querySelectorAll(".felt").forEach(f=>f.classList.remove("pulse"));
  root.querySelectorAll(".card").forEach(c=>c.classList.remove("loser","sel","fadeout","hl","dimmed"));
  root.querySelectorAll(".fcard").forEach(f=>{ f.classList.remove("go","loser"); f.style.removeProperty("--fd"); });
  root.querySelectorAll(".ricochet").forEach(r=>r.classList.remove("ricochet"));
  root.querySelectorAll(".swpR,.swpL").forEach(p=>p.classList.remove("swpR","swpL"));
  root.querySelectorAll(".deck").forEach(d=>d.classList.remove("dim"));
  const yv=$("#s06yv"); if(yv) yv.textContent="0";
  const y7=$("#s07yv"); if(y7) y7.textContent="3";
  const y12=$("#s12yv"); if(y12) y12.textContent="0";
  const y15=$("#s15yv"); if(y15) y15.textContent="15";
  const e15=$("#s15ev"); if(e15) e15.textContent="30";
  const e16=$("#s16ev"); if(e16){ e16.textContent="38"; e16.style.color=""; }
  const en=$("#s17enemy"); if(en){ en.style.transform=""; en.style.filter=""; en.style.animation=""; }
  const rp=$("#replay"); if(rp) rp.classList.remove("show");
  const f2=$("#s02felt"); if(f2) f2.classList.remove("up");
  root.querySelectorAll(".typing").forEach(t=>t.classList.remove("typing"));
}
function applyBeatUpTo(s,n){
  const root=document.getElementById(s.id), bt=s.beats[n];
  const gid=bt&&bt.g!=null?bt.g:n;
  root.querySelectorAll(".b").forEach(g=>{ if(+g.dataset.b<=+gid) g.classList.add("on"); });
  const g=root.querySelector('.b[data-b="'+gid+'"]');
  if(g){
    if(g._chtitle && g._chstr) typeOn(g._chtitle, g._chstr, 20);
    if(g.dataset.fn && FNS[g.dataset.fn]) FNS[g.dataset.fn](root);
  }
  if(bt){
    if(bt.fx) doFx(root,bt.fx);
    if(bt.wave) waveCards(root,bt.wave);
    if(bt.burst) burst(bt.burst[0],bt.burst[1],bt.burst[2],bt.burst[3]);
    if(bt.ifx) impactFrame(bt.ifx);
    if(bt.punch) punch(bt.punch);
    if(bt.cf) confetti(bt.cf[0],bt.cf[1],bt.cf[2]);
  }
}
function setCap(bt){
  if(!bt||!bt.cap) return;
  cap.classList.remove("show"); void cap.offsetWidth;
  capBig.innerHTML="";
  bt.cap.split(" ").forEach((wd,i)=>{
    const s=el("span","w"); s.textContent=wd; s.style.setProperty("--wd",(i*0.07)+"s");
    capBig.appendChild(s);
  });
  capSub.textContent=bt.sub||"";
  cap.classList.add("show");
}
function flash(){ const f=$("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
function shake(){ stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }
function wipe(){ const w=$("#wipe"); w.classList.remove("go"); void w.offsetWidth; w.classList.add("go"); }
function setCam(s,instant){
  const c=s.cam||{z:1,x:0,y:0,t:8};
  if(instant){ camEl.style.transition="none"; camEl.style.transform="scale("+c.z+") translate("+c.x+"px,"+c.y+"px)"; return; }
  camEl.style.transition="none"; camEl.style.transform="scale(1) translate(0px,0px)";
  void camEl.offsetWidth;
  camEl.style.transition="transform "+(c.t||8)+"s cubic-bezier(.4,0,.4,1)";
  camEl.style.transform="scale("+c.z+") translate("+c.x+"px,"+c.y+"px)";
}
function play(i){
  if(i<0||i>=SCENES.length) return;
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  if(idx>=0){ AUD[SCENES[idx].id].pause(); AUD[SCENES[idx].id].currentTime=0; }
  idx=i; playing=true; beatOn=-1;
  SCENES.forEach((s,j)=>{ resetScene(s); document.getElementById(s.id).classList.toggle("active",j===i); });
  const s=SCENES[i];
  hudN.textContent=String(i+1).padStart(2,"0")+" / "+SCENES.length;
  hudL.textContent=s.label;
  Array.prototype.forEach.call(dotsEl.children,(d,j)=>d.classList.toggle("cur",j===i));
  setCam(s,false);
  wipe(); sfx("wipe");
  if(s.chapter){ flash(); sfx("boom"); }
  const a=AUD[s.id]; a.currentTime=0;
  a.play().catch(()=>{});
}
function pauseToggle(){
  if(idx<0||holdTimer) return;
  const a=AUD[SCENES[idx].id];
  if(playing){ a.pause(); playing=false; }
  else { a.play(); playing=true; }
}
Object.keys(AUD).forEach(id=>{
  AUD[id].addEventListener("ended",()=>{
    if(!playing) return;
    playing=false;
    bar.style.width="100%";
    const i=SCENES.findIndex(s=>s.id===id);
    if(i<SCENES.length-1){
      holdTimer=setTimeout(()=>{ holdTimer=null; play(i+1); }, (SCENES[i].hold||0.7)*1000);
    }
  });
});
function tick(){
  if(playing&&idx>=0){
    const s=SCENES[idx], a=AUD[s.id], d=a.duration||8;
    const p=Math.min(a.currentTime/d,1);
    let bi=-1;
    for(let i=0;i<s.beats.length;i++) if(p>=s.beats[i].f) bi=i;
    if(bi>beatOn){
      for(let i=beatOn+1;i<=bi;i++){
        applyBeatUpTo(s,i);
        const bt=s.beats[i];
        if(bt.sfx) (Array.isArray(bt.sfx)?bt.sfx:[bt.sfx]).forEach(e=>{
          if(Array.isArray(e)) sfx(e[0],(e[1]||0)*1000); else sfx(e,0);
        });
        setCap(bt);
      }
      beatOn=bi;
    }
    bar.style.width=(p*100)+"%";
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------------- chapter menu ---------------- */
const menu=$("#menu");
const GROUPS=[
  {h:"The Open",ids:["s01"]},
  {h:"The Table & The Deal",ids:["s02"]},
  {h:"The Cards",ids:["s04","s05"]},
  {h:"The Duel",ids:["s06","s07","s08"]},
  {h:"The Tricks",ids:["s09","s10","s11","s12","s13","s14","s15","s16"]},
  {h:"Settled",ids:["s17"]},
];
let wasPlaying=false;
(function buildMenu(){
  const list=$("#mlist");
  GROUPS.forEach(gr=>{
    const g=el("div","mgroup");
    g.appendChild(el("div","gh")).textContent=gr.h;
    gr.ids.forEach(id=>{
      const i=SCENES.findIndex(s=>s.id===id), s=SCENES[i];
      const it=el("div","mitem");
      it.innerHTML='<span class="mn">'+String(i+1).padStart(2,"0")+'</span><span class="ml">'+s.label+"</span>";
      it.addEventListener("click",e=>{ e.stopPropagation(); toggleMenu(false); play(i); });
      g.appendChild(it);
    });
    list.appendChild(g);
  });
})();
function toggleMenu(force){
  const open=force!=null?force:!menu.classList.contains("open");
  if(open){
    if(playing){ wasPlaying=true; AUD[SCENES[idx].id].pause(); playing=false; }
    Array.prototype.forEach.call($("#mlist").children,(g,gi)=>{
      Array.prototype.forEach.call(g.querySelectorAll(".mitem"),(it,ii)=>{
        const globalIdx=SCENES.findIndex(s=>s.id===GROUPS[gi].ids[ii]);
        it.classList.toggle("cur",globalIdx===idx);
      });
    });
    menu.classList.add("open");
  } else {
    menu.classList.remove("open");
    if(wasPlaying&&idx>=0){ AUD[SCENES[idx].id].play(); playing=true; wasPlaying=false; }
  }
}
$("#menuBtn").addEventListener("click",e=>{ e.stopPropagation(); if(started) toggleMenu(); });
$("#menuX").addEventListener("click",e=>{ e.stopPropagation(); toggleMenu(false); });

/* ---------------- controls ---------------- */
$("#beginGo").addEventListener("click",()=>{
  try{ ac(); }catch(e){}
  $("#begin").style.display="none"; started=true; play(0);
});
stage.addEventListener("click",e=>{
  if(!started) return;
  if(e.target.closest("#replay,#dots,#begin,#menu,#menuBtn")) return;
  pauseToggle();
});
window.addEventListener("keydown",e=>{
  if(!started) return;
  if(e.code==="Space"){ e.preventDefault(); pauseToggle(); }
  if(e.code==="KeyM" && !HIDE_UI){ toggleMenu(); }
  if(e.code==="Escape"){ toggleMenu(false); }
  if(e.code==="ArrowRight") play(Math.min(idx+1,SCENES.length-1));
  if(e.code==="ArrowLeft") play(Math.max(idx-1,0));
});
let tX=0,tY=0,tT=0;
stage.addEventListener("touchstart",e=>{
  tX=e.touches[0].clientX; tY=e.touches[0].clientY; tT=Date.now();
},{passive:true});
stage.addEventListener("touchend",e=>{
  if(!started) return;
  if(e.target.closest("#replay,#dots,#begin,#menu,#menuBtn")) return;
  const dx=e.changedTouches[0].clientX-tX, dy=e.changedTouches[0].clientY-tY;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){
    if(dx<0) play(Math.min(idx+1,SCENES.length-1)); else play(Math.max(idx-1,0));
  } else if(Date.now()-tT<300){ pauseToggle(); }
},{passive:true});
function fit(){
  const sc=Math.min(innerWidth/1600,innerHeight/900);
  stage.style.transform="scale("+sc+")";
}
addEventListener("resize",fit); fit();

/* ---------------- build scenes ---------------- */
buildS01(); buildS02(); buildS04(); buildS05(); buildS06();
buildS07(); buildS08(); buildS09(); buildS10(); buildS11(); buildS12();
buildS13(); buildS14(); buildS15(); buildS16(); buildS17();

/* ---------------- always-on ambient motion ---------------- */
(function initAmbient(){
  const cam=$("#cam"), vign=$(".bg-vign");
  const amb=el("div",""); amb.id="amb";
  amb.appendChild(el("div","amb-stripes"));
  amb.appendChild(el("div","amb-breathe"));

/* ---------------- video render mode (?video=1) ---------------- */
const HIDE_UI = false; /* set false to bring back INDEX / dots / counter / replay */
if(HIDE_UI) document.documentElement.classList.add("noui");
const VIDEO = new URLSearchParams(location.search).get("video")==="1";
window.__VIDEO = VIDEO;
if(VIDEO){
  document.documentElement.classList.add("videomode");
  for(const k in AUD) AUD[k].muted = true;
  document.getElementById("begin").style.display = "none";
}
window.__ready = true;
window.__startVideo = function(){
  started = true;
  const now = Date.now()/1000;
  play(0);
  return now;
};
window.__videoInfo = function(){
  const durs = SCENES.map(s=>isFinite(AUD[s.id].duration)?AUD[s.id].duration:8);
  let total=0; const starts=[];
  SCENES.forEach((s,i)=>{ starts.push(total); total += durs[i] + (s.hold||0.7); });
  return {durs, starts, total: total+1.2};
};
function audioBufferToWavB64(buf){
  const numCh=buf.numberOfChannels, len=buf.length, sr=buf.sampleRate;
  const bytes=44+len*numCh*2;
  const ab=new ArrayBuffer(bytes); const v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,bytes-8,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,numCh,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*numCh*2,true); v.setUint16(32,numCh*2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,len*numCh*2,true);
  const chans=[]; for(let c=0;c<numCh;c++) chans.push(buf.getChannelData(c));
  let o=44;
  for(let i=0;i<len;i++) for(let c=0;c<numCh;c++){ let s=Math.max(-1,Math.min(1,chans[c][i])); v.setInt16(o, s<0?s*0x8000:s*0x7FFF, true); o+=2; }
  const u8=new Uint8Array(ab); let bin=''; const chunk=0x8000;
  for(let i=0;i<u8.length;i+=chunk) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+chunk));
  return btoa(bin);
}
window.__renderMixAudio = async function(){
  const SR=48000;
  const info=window.__videoInfo();
  const off=new OfflineAudioContext(2, Math.ceil(info.total*SR), SR);
  const bufs={};
  for(const s of SCENES){
    const ab=await fetch("audio/"+s.id+".mp3").then(r=>r.arrayBuffer());
    bufs[s.id]=await off.decodeAudioData(ab);
  }
  const FN_SFX={
    /* beat-index keyed: sounds that FNS fire internally (countUp ticks etc.)
       — indices match the word-anchored beat lists above */
    s06:{6:[["score",.05],["tick",.35],["tick",.6],["tick",.85]]},
    s07:{2:[["deal",.05]],6:[["score",.05],["tick",.35],["tick",.6],["tick",.85]]},
    s12:{2:[["score",.05],["tick",.3],["tick",.55]]},
    s15:{2:[["score",.05],["tick",.35],["tick",.6],["tick",.85]]},
    s16:{5:[["sting",.05],["boom",.15]]},
    s17:{4:[["chime",.15]]},
  };
  const sched=[];
  SCENES.forEach((s,i)=>{
    const t0=info.starts[i], d=info.durs[i];
    sched.push({t:t0,kind:"wipe"});
    if(s.chapter) sched.push({t:t0,kind:"boom"});
    const src=off.createBufferSource(); src.buffer=bufs[s.id]; src.connect(off.destination); src.start(t0);
    s.beats.forEach(bt=>{
      const btT=t0+bt.f*d;
      (Array.isArray(bt.sfx)?bt.sfx:[bt.sfx]).forEach(e=>{
        if(Array.isArray(e)) sched.push({t:btT+(e[1]||0),kind:e[0]}); else sched.push({t:btT,kind:e});
      });
      const bi=s.beats.indexOf(bt);
      const extra=(FN_SFX[s.id]||{})[bi];
      if(extra) extra.forEach(e=>sched.push({t:btT+(e[1]||0),kind:e[0]}));
    });
  });
  for(const e of sched) sfxSynth(off, e.t, e.kind, off.destination);
  const buf=await off.startRendering();
  return audioBufferToWavB64(buf);
};

/* ---------------- QA freeze mode (?t=sXX&beat=N) ---------------- */
(function(){
  const q=new URLSearchParams(location.search);
  const sid=q.get("t");
  if(!sid) return;
  const i=SCENES.findIndex(s=>s.id===sid);
  if(i<0) return;
  const s=SCENES[i];
  const nB=s.beats.length;
  const n=q.get("beat")!=null?Math.min(+q.get("beat"),nB-1):nB-1;
  idx=i; playing=false;
  SCENES.forEach((sc,j)=>{ resetScene(sc); document.getElementById(sc.id).classList.toggle("active",j===i); });
  stage.classList.add("freeze");
  setCam(s,true);
  for(let k=0;k<=n;k++) applyBeatUpTo(s,k);
  setCap(s.beats[n]);
  hudN.textContent=String(i+1).padStart(2,"0")+" / "+SCENES.length;
  hudL.textContent=s.label;
  Array.prototype.forEach.call(dotsEl.children,(d,j)=>d.classList.toggle("cur",j===i));
  document.getElementById("begin").style.display="none";
})();
</script>
