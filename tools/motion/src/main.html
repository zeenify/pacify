<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="icon" href="data:," />
<title>PACIFY — How To Play (motion graphics)</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;500;700&display=block" rel="stylesheet" />

<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>

<style>
  /* No CSS transitions or keyframe animations anywhere: they are wall-clock
     driven and would break deterministic frame-stepping. All motion is written
     as inline styles from seek(). Overlay discipline (v2): the 3D scene is the
     frame; DOM carries at most ONE kicker (top-left), ONE headline zone
     (bottom-centre) and occasional centred pops. No decorative DOM. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0A0A0A; }
  body { position: relative; font-family: 'Oswald', sans-serif; }

  #bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 90% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
    opacity: 0;
  }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #dom { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .act { position: absolute; inset: 0; }
  .ov { position: absolute; white-space: nowrap; }

  .kick    { left: 64px; top: 54px; font: 500 24px 'Oswald'; letter-spacing: 10px; color: rgba(252,238,33,0.85); }
  .cap     { left: 0; right: 0; bottom: 96px; text-align: center; font: 118px 'Anton'; color: #fff; letter-spacing: 2px; text-shadow: 8px 8px 0 #E60012; }
  .capsub  { left: 0; right: 0; bottom: 52px; text-align: center; font: 300 27px 'Oswald'; letter-spacing: 6px; color: rgba(255,255,255,0.75); }
  .pop     { left: 0; right: 0; top: 38%; text-align: center; font: 210px 'Anton'; color: #FCEE21; text-shadow: 12px 12px 0 rgba(0,0,0,0.85); }
  .popsub  { left: 0; right: 0; top: 27%; text-align: center; font: 500 34px 'Oswald'; letter-spacing: 8px; color: rgba(255,255,255,0.85); text-shadow: 3px 3px 0 rgba(0,0,0,0.8); }
  .sideL   { left: 90px; top: 42%; font: 76px 'Anton'; color: #fff; text-shadow: 7px 7px 0 rgba(0,0,0,0.85); }
  .sideR   { right: 90px; top: 42%; font: 76px 'Anton'; color: #FCEE21; text-shadow: 7px 7px 0 rgba(0,0,0,0.85); }
  .goal    { left: 0; right: 0; top: 30%; text-align: center; font: 150px 'Anton'; color: #fff; text-shadow: 10px 10px 0 #E60012; }
  .tiny    { font: 700 26px 'Oswald'; letter-spacing: 5px; color: rgba(255,255,255,0.85); text-shadow: 2px 2px 0 rgba(0,0,0,0.85); }
  .stamp   { font: 130px 'Anton'; color: #E60012; border: 10px solid #E60012; padding: 4px 36px; background: rgba(10,10,10,0.85); text-shadow: none; }
  .multline{ left: 0; right: 0; bottom: 170px; text-align: center; font: 62px 'Anton'; color: #FCEE21; text-shadow: 6px 6px 0 rgba(0,0,0,0.85); }

  #fatal {
    position: absolute; inset: 0; display: none;
    background: #E60012; color: #fff;
    font: 28px 'Oswald'; padding: 60px; white-space: pre-wrap; z-index: 99;
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="dom"></div>
  <div id="fatal"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
